<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>
<style>
  .wrap { display: flex; flex-direction: column; gap: 10px; padding: 2px 0 8px; }
  .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  .vs { display: inline-flex; padding: 3px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); }
  .vs button { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border: 0; border-radius: 9px; background: transparent; color: var(--muted-foreground); font-size: 13px; font-weight: 500; cursor: pointer; box-shadow: none; }
  .vs button b { font-weight: 700; }

  #reset { font: inherit; font-size: 12.5px; padding: 7px 12px; border: 1px solid var(--border); border-radius: 10px; background: transparent; color: var(--muted-foreground); cursor: pointer; box-shadow: none; }

  .ph { --bg: #F2F2F8; --cd: #FFFFFF; --sf: #EAEAF3; --t1: #0D0D14; --t2: #66667A; --t3: #8B8B9C; --pr: #4F46E5; --prl: rgba(79,70,229,.10); --bd: #E3E3EE; --dn: #E11D48; --ok: #059669;
    position: relative; width: 100%; max-width: 390px; height: 780px; margin: 0 auto; box-sizing: border-box;
    background: var(--bg); color: var(--t1); border: 10px solid #18181F; border-radius: 46px; overflow: hidden;
    display: flex; flex-direction: column; font: 14px/1.35 Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  @media (max-width: 430px) { .ph { border-width: 0; border-radius: 18px; height: 740px; } }
  .device body { margin: 0; }
  .device .wrap { padding: 0; }
  .device .top, .device .hint { display: none; }
  .device .ph { max-width: none; height: 100dvh; border: 0; border-radius: 0; }
  .device .ph .sb { display: none; }

  .ph .sb { flex: none; height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0; font-size: 13px; font-weight: 600; }

  .ph .bat::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; background: var(--t1); border-radius: 1px; }

  .ph .hdr-t.sm { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }

  .ph .day .dt { margin-left: auto; font-weight: 500; color: var(--t3); font-variant-numeric: tabular-nums; }
  .ph .card { background: var(--cd); border-radius: 18px; padding: 4px; }
  .ph .row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 10px; border-radius: 14px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

  /* B: tabs, facet rail, dock */

  .ph .srch { flex: none; display: flex; align-items: center; gap: 8px; margin: 0 14px 10px; padding: 0 6px 0 12px; height: 42px; background: var(--cd); border-radius: 13px; color: var(--t3); }

  .ph .srow { display: flex; align-items: center; gap: 8px; padding-left: 2px; }

  .ph .act.dn { color: #FDA4AF; }

  .ph .lbl { min-width: 0; font-size: 12.5px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .ph .cg { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 12px 4px 10px; border-radius: 15px; background: var(--bg); font-size: 13px; font-weight: 500; text-align: center; }
  .ph .ft { display: flex; align-items: center; gap: 8px; padding: 16px 10px; margin: 2px 0 10px; background: var(--bg); border-radius: 18px; }
  .ph .side { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 7px; text-align: center; font-size: 13.5px; font-weight: 600; }

</style>

  function seed() {

  }

  function inPeriod(t) {
    if (S.period === 'sep') return false;
    if (S.period === 'week') return t.d >= 24;

  }
  function match(t) {
    if (!inPeriod(t)) return false;
    if (S.type !== 'all' && t.type !== S.type) return false;

  let suppressClick = 0;

    let timer = null, x = 0, y = 0;

  function row(t, mode) {

      if (!S.selecting) { S.selecting = true; S.sel.clear(); S.anim = true; }

    out.push(PERIODS[S.period] + (S.period === 'week' ? '' : ' 2026'));
    if (S.type !== 'all') out.push(TYPES[S.type]);
    S.cats.forEach((k) => out.push(CATS[k].name));
    S.tags.forEach((k) => out.push('#' + k));
    S.accs.forEach((k) => out.push(ACCS[k].name));
    if (S.q.trim()) out.push('«' + S.q.trim() + '»');
    return out;
  }
  function allSheet() {
    const ts = targets(), n = ts.length;
    const locked = visible().filter((t) => t.lock).length;
    return sheet('Изменить все ' + nOpsAcc(n), [
      h('div', { class: 'scope' },
        h('div', { class: 'scope-c' }, scopeChips().map((c) => h('span', { class: 'sc' }, c))),
        h('div', { class: 'scope-s' }, h('span', { class: 'k' }, nOps(n)), h('span', { class: 'v' }, sumLabel(ts)))),
      verbRows(),
      locked ? h('p', { class: 'note' }, locked + ' ' + pl(locked, 'операция связана', 'операции связаны', 'операций связаны') + ' с долгом и в выборку не ' + pl(locked, 'входит', 'входят', 'входят') + ': такие правятся из карточки долга.') : null]);
  }
  function verbRows() {
    const V = [
      ['category', 'folder', 'Перенести в другую категорию', () => goSheet({ kind: 'pickCat', back: S.sheet })],
      ['transfer', 'swap', 'Сделать переводом на свой счёт', () => goSheet({ kind: 'pickAcc', action: 'transfer', back: S.sheet })],
      ['account', 'wallet', 'Сменить счёт', () => goSheet({ kind: 'pickAcc', action: 'account', back: S.sheet })],
      ['tag', 'tag', 'Добавить тег', () => goSheet({ kind: 'tag', back: S.sheet })],
      ['delete', 'trash', 'Удалить', () => goSheet({ kind: 'confirm', action: 'delete', back: S.sheet })]
    ];
    return V.map((x) =>
      h('button', { type: 'button', class: 'verb' + (x[0] === 'delete' ? ' dn' : ''), 'data-k': 'v' + x[0], onclick: x[3] },
        h('span', { class: 'vi' }, icon(x[1], 20)), h('span', { class: 'vt' }, x[2])));
  }
  function backFn() { const b = S.sheet && S.sheet.back; return b ? () => goSheet(b) : null; }
  function pickCatSheet() {
    const ts = targets();
    const kinds = new Set(ts.map((t) => t.type));
    const groups = [];
    if (kinds.has('expense') || !kinds.has('income')) groups.push(['Расходы', 'expense']);
    if (kinds.has('income')) groups.push(['Доходы', 'income']);
    const cur = new Set(ts.map((t) => t.cat));
    const content = groups.map((g) => [
      groups.length > 1 ? h('div', { class: 'sec-t' }, g[0]) : null,
      h('div', { class: 'catgrid' }, Object.keys(CATS).filter((k) => CATS[k].kind === g[1]).map((k) =>
        h('button', { type: 'button', class: 'cg', 'data-k': 'cg' + k, disabled: cur.size === 1 && cur.has(k),
          onclick: () => goSheet({ kind: 'confirm', action: 'category', target: k, back: S.sheet }) }, catIco(k, 20), CATS[k].name)))]);
    return sheet('Куда перенести', content, null, backFn());
  }
  function pickAccSheet(action) {
    const content = Object.keys(ACCS).map((k) =>
      h('button', { type: 'button', class: 'opt', 'data-k': 'pa' + k, onclick: () => goSheet({ kind: 'confirm', action, target: k, back: S.sheet }) },
        accIco(k), h('span', { class: 'ot' }, ACCS[k].name, h('span', { class: 'od' }, money(balance(k)))), icon('right', 16)));
    return sheet(action === 'transfer' ? 'На какой счёт ушли деньги' : 'На какой счёт перенести', content, null, backFn());
  }
  function tagSheet() {
    const ts = targets();
    const inp = h('input', { type: 'text', 'data-k': 'tagin', autocomplete: 'off', placeholder: 'новый тег', 'aria-label': 'Новый тег' });
    inp.value = S.tagText;
    const addNew = () => {
      const v = S.tagText.trim().replace(/^#/, '').toLowerCase().replace(/\s+/g, '_');
      if (v) apply('tag', v);
    };
    inp.addEventListener('input', () => (S.tagText = inp.value));
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addNew(); } });
    const content = [
      h('div', { class: 'chips' }, allTags().map((g) => {
        const missing = ts.filter((t) => !t.tags.includes(g)).length;
        return h('button', { type: 'button', class: 'chip', 'data-k': 'tg' + g, disabled: !missing, onclick: () => apply('tag', g) }, '#' + g);
      })),
      h('div', { class: 'tagnew' }, h('span', { class: 'hash' }, '#'), inp, h('button', { type: 'button', class: 'btn pr sm', onclick: addNew }, 'Добавить'))];
    return sheet('Тег для ' + nOpsGen(ts.length), content, null, backFn());
  }

  function preview(action, target) {
    const ts = targets();
    let ok;
    if (action === 'category') ok = ts.filter((t) => t.type === CATS[target].kind && t.cat !== target);
    else if (action === 'transfer') ok = ts.filter((t) => t.type === 'expense' && t.acc !== target);
    else if (action === 'account') ok = ts.filter((t) => t.acc !== target && t.toAcc !== target);
    else if (action === 'tag') ok = ts.filter((t) => !t.tags.includes(target));
    else ok = ts;
    return { ok, skip: ts.length - ok.length };
  }
  function mutate(t, action, target) {
    if (action === 'category') t.cat = target;
    else if (action === 'transfer') { t.type = 'transfer'; t.cat = 'transfer'; t.toAcc = target; }
    else if (action === 'account') t.acc = target;
    else if (action === 'tag') t.tags.push(target);
  }
  function balanceDeltas(action, target, ok) {
    const before = effects(ok);
    const after = action === 'delete' ? {} : effects(ok.map((t) => { const c = clone(t); mutate(c, action, target); return c; }));
    const out = [];
    Object.keys(ACCS).forEach((k) => {
      const d = (after[k] || 0) - (before[k] || 0);
      if (d) out.push({ k, from: balance(k), to: balance(k) + d });
    });
    return out;
  }
  const kv = (k, v) => h('div', { class: 'kv' }, h('span', { class: 'k' }, k), h('span', { class: 'v' }, v));
  function side(icons, label) { return h('div', { class: 'side' }, h('span', { class: 'stack' }, icons), h('span', null, label)); }
  function confirmSheet(action, target) {
    const { ok, skip } = preview(action, target);
    const n = ok.length;
    const sum = ok.reduce((s, t) => s + t.amount, 0);
    const parts = [];
    if (action === 'category' || action === 'transfer' || action === 'account') {
      let left, right;
      if (action === 'category') {
        const from = [...new Set(ok.map((t) => t.cat))];
        left = side(from.slice(0, 3).map((k) => catIco(k)), from.length === 1 ? CATS[from[0]].name : from.length + ' ' + pl(from.length, 'категория', 'категории', 'категорий'));
        right = side([catIco(target)], CATS[target].name);
      } else {
        const from = [...new Set(ok.map((t) => t.acc))];
        left = side(from.slice(0, 3).map(accIco), from.length === 1 ? ACCS[from[0]].name : from.length + ' ' + pl(from.length, 'счёт', 'счёта', 'счетов'));
        right = side([accIco(target)], ACCS[target].name);
      }
      if (n) parts.push(h('div', { class: 'ft' }, left, h('span', { class: 'fa' }, icon('arrow', 22)), right));
    }
    if (n) {
      parts.push(kv('Операций', String(n)), kv('На сумму', money(sum)));
      if (action === 'transfer') {
        const exp = totals(S.txs.filter((t) => inPeriod(t))).exp;
        parts.push(kv('Расходы за октябрь', fmt(exp) + ' → ' + fmt(exp - sum)));
      }
      balanceDeltas(action, target, ok).forEach((b) => parts.push(kv(ACCS[b.k].name, fmt(b.from) + ' → ' + fmt(b.to))));
      const notes = {
        category: 'Суммы и балансы счетов не изменятся.',
        transfer: 'Деньги по-прежнему списаны с исходных счетов, но теперь это пополнение «' + (ACCS[target] || {}).name + '», а не расход.',
        account: 'Суммы не изменятся, поменяются балансы счетов.',
        delete: 'Балансы счетов пересчитаются. Сразу после удаления его можно отменить.'
      };
      parts.push(h('p', { class: 'note' }, notes[action]));
    }
    if (skip) parts.push(h('p', { class: 'note warn' }, skip + ' ' + pl(skip, 'операция не подходит', 'операции не подходят', 'операций не подходят') +
      (action === 'transfer' ? ' (это не расходы или они уже с этого счёта)' : action === 'category' ? ' (другой тип или уже в этой категории)' : '') + ' и останется как есть.'));
    if (!n) parts.push(h('p', { class: 'note' }, 'Ни одна из выбранных операций не подходит для этого действия.'));
    // Про долг говорим, только когда меняется вся выборка: при ручном выборе строку с замком никто не отмечал.
    const wholeSet = S.variant === 'C' || targets().length === selectable().length;
    const locked = wholeSet ? visible().filter((t) => t.lock).length : 0;
    if (locked) parts.push(h('p', { class: 'note' }, locked + ' ' + pl(locked, 'операция связана', 'операции связаны', 'операций связаны') + ' с долгом и не изменится: такие правятся из карточки долга.'));
    const titles = { category: 'Перенести в «' + (CATS[target] || {}).name + '»', transfer: 'Сделать переводами', account: 'Перенести на «' + (ACCS[target] || {}).name + '»', delete: 'Удалить ' + nOpsAcc(n) + '?' };
    const verbs = { category: 'Перенести ' + n, transfer: 'Сделать ' + pl(n, 'переводом', 'переводами', 'переводами'), account: 'Перенести ' + n, delete: 'Удалить ' + n };
    const back = backFn();
    return sheet(titles[action], parts, [
      h('button', { type: 'button', class: 'btn sec', 'data-k': 'cback', onclick: back || closeSheet }, back ? 'Назад' : 'Отмена'),
      h('button', { type: 'button', class: 'btn grow ' + (action === 'delete' ? 'dn' : 'pr'), 'data-k': 'cgo', disabled: !n, onclick: () => apply(action, target) }, verbs[action])], back);
  }

  function apply(action, target) {
    const { ok } = preview(action, target);
    if (!ok.length) return;
    const n = ok.length;
    const snap = ok.map(clone);
    if (action === 'delete') { const ids = new Set(ok.map((t) => t.id)); S.txs = S.txs.filter((t) => !ids.has(t.id)); }
    else ok.forEach((t) => mutate(t, action, target));
    S.undo = { snap, deleted: action === 'delete' };
    S.selecting = false; S.sel.clear(); S.excl.clear(); S.sheet = null; S.allMode = false; S.tagText = '';
    let msg;
    if (action === 'category') {
      // Показываем, куда операции переехали: иначе отфильтрованный список просто опустеет.
      S.cats = new Set([target]); S.accs.clear(); S.tags.clear(); S.q = '';
      S.type = S.variant === 'C' && CATS[target].kind === 'expense' ? 'expense' : 'all';
      if (S.variant === 'C') S.lensDim = 'cat';
      msg = nOps(n) + ' теперь в «' + CATS[target].name + '»';
    } else if (action === 'transfer') {
      S.cats.clear(); S.tags.clear(); S.q = ''; S.type = 'all';
      if (S.variant === 'C') S.accs.clear(); else S.accs = new Set([target]);
      msg = nOps(n) + ' ' + pl(n, 'стала переводом', 'стали переводами', 'стали переводами') + ' на «' + ACCS[target].name + '»';
    } else if (action === 'account') {
      msg = nOps(n) + ' ' + pl(n, 'перенесена', 'перенесены', 'перенесены') + ' на «' + ACCS[target].name + '»';
    } else if (action === 'tag') {
      msg = 'Тег #' + target + ' добавлен к ' + n + ' ' + pl(n, 'операции', 'операциям', 'операциям');
    } else msg = 'Удалено: ' + nOps(n);
    S.resetScroll = true;
    toast(msg, true);
  }
  function undo() {
    const u = S.undo;
    if (!u) return;
    if (u.deleted) S.txs = S.txs.concat(u.snap);
    else u.snap.forEach((s) => { const i = S.txs.findIndex((t) => t.id === s.id); if (i >= 0) S.txs[i] = s; });
    S.undo = null;
    toast('Изменение отменено', false);
  }
  let toastTimer = 0;
  function toast(msg, undoable) {
    S.toast = { msg, undo: !!undoable };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { S.toast = null; render(); }, undoable ? 6000 : 2600);
    render();
  }

  function sheetView() {
    const s = S.sheet;
    if (!s) return null;
    const body = s.kind === 'verbs' ? verbsSheet()
      : s.kind === 'all' ? allSheet()
      : s.kind === 'facet' ? facetSheet(s.facet)
      : s.kind === 'pickCat' ? pickCatSheet()
      : s.kind === 'pickAcc' ? pickAccSheet(s.action)
      : s.kind === 'tag' ? tagSheet()
      : confirmSheet(s.action, s.target);
    return h('div', { class: 'ov', onclick: (e) => { if (e.target === e.currentTarget) closeSheet(); } }, body);
  }
  function toastView() {
    if (!S.toast) return null;
    return h('div', { class: 'toast', role: 'status' }, h('span', { class: 'tm' }, S.toast.msg),
      S.toast.undo && S.undo ? h('button', { type: 'button', class: 'tu', 'data-k': 'undo', onclick: undo }, 'Отменить') : null);
  }

  const phone = document.getElementById('ph');
  const hintEl = document.getElementById('hint');
  function render() {
    const prev = phone.querySelector('.list');
    const top = prev ? prev.scrollTop : 0;
    const ae = document.activeElement;
    const focusKey = ae && phone.contains(ae) && ae.getAttribute ? ae.getAttribute('data-k') : null;
    const views = { A: variantA, B: variantB, C: variantC };
    const kids = [statusBar()].concat(views[S.variant](), [sheetView(), toastView()]).filter(Boolean);
    phone.replaceChildren(...kids);
    const list = phone.querySelector('.list');
    if (list && !S.resetScroll) list.scrollTop = top;
    S.resetScroll = false;
    if (S.sheetAnim) {
      const sh = phone.querySelector('.sh');
      if (sh) sh.focus({ preventScroll: true });
    } else if (focusKey) {
      const el = [...phone.querySelectorAll('[data-k]')].find((x) => x.getAttribute('data-k') === focusKey);
      if (el) {
        el.focus({ preventScroll: true });
        if (el.tagName === 'INPUT') { const n = el.value.length; el.setSelectionRange(n, n); }
      }
    }
    S.sheetAnim = false; S.anim = false;
    document.querySelectorAll('.vs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === S.variant)));
    hintEl.textContent = HINTS[S.variant];
  }

  document.querySelectorAll('.vs button').forEach((b) => b.addEventListener('click', () => { resetAll(); S.variant = b.dataset.v; render(); }));
  document.getElementById('reset').addEventListener('click', () => { resetAll(); render(); });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (S.sheet) closeSheet();
    else if (S.suggest) closeSuggest();
    else if (S.selecting) { S.selecting = false; S.sel.clear(); render(); }
  });
  // Режим устройства: ?device=1 растягивает экран на весь вьюпорт; v, cat, open задают стартовое состояние.
  const params = new URLSearchParams(location.search);
  if (params.get('device')) document.documentElement.classList.add('device');
  if (/^[ABC]$/.test(params.get('v') || '')) S.variant = params.get('v');
  (params.get('cat') || '').split(',').filter((k) => CATS[k]).forEach((k) => S.cats.add(k));
  if (params.get('open') === 'all' && S.variant === 'B' && selectable().length) { S.allMode = true; S.sheet = { kind: 'all' }; }
  render();
})();
</script>

</body>
</html>
